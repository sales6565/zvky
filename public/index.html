/* ---------- settings: the value lists behind the dropdowns ---------- */
/* Super Admin only. The tab is hidden without the capability and the API
   refuses the writes regardless, so hiding it is a convenience, not the check. */

const REF_SECTIONS = [
  {
    collection: 'asset-types',
    title: 'Asset Types',
    note: 'The Type dropdown on Add Asset, and the prefix each asset code is built from (CHR-001).',
    columns: [
      { key:'label',      label:'Name',   input:'text',  placeholder:'e.g. Vehicle', required:true },
      { key:'codePrefix', label:'Prefix', input:'text',  placeholder:'VEH', narrow:true },
      { key:'color',      label:'Colour', input:'color' },
    ],
  },
  {
    collection: 'priorities',
    title: 'Priorities',
    note: 'The Priority dropdown on Add Asset and in the asset drawer.',
    columns: [
      { key:'label', label:'Name',   input:'text', placeholder:'e.g. Critical', required:true },
      { key:'color', label:'Colour', input:'color' },
    ],
  },
  {
    collection: 'roles',
    title: 'Roles',
    note: 'The Role dropdown on Add User. What a role can do comes from its tier — pick the closest match.',
    columns: [
      { key:'label', label:'Name',  input:'text',   placeholder:'e.g. Senior Rigger', required:true },
      { key:'group', label:'Group', input:'group' },
      { key:'tier',  label:'Can do', input:'tier' },
      { key:'color', label:'Colour', input:'color' },
    ],
  },
];

let refCache = {};

async function renderSettings(){
  const el = document.getElementById('settingsView');
  if(!caps().manageSettings){ el.innerHTML = ''; return; }

  /* Deactivated values are included so they can be seen and reactivated. */
  const loaded = await Promise.all(REF_SECTIONS.map(sec =>
    api('/reference/' + sec.collection + '?includeInactive=1').then(r => r.entries).catch(() => [])
  ));
  REF_SECTIONS.forEach((sec,i)=>{ refCache[sec.collection] = loaded[i]; });

  el.innerHTML = `
    <div style="font-size:12px;color:var(--ink-muted);margin-bottom:20px;max-width:640px;">
      These are the value lists the forms use. Renaming one is safe — records that already use it keep working.
      A value in use can't be deleted; deactivate it instead and it disappears from the dropdowns.
    </div>
    ${REF_SECTIONS.map(sec=>renderRefSection(sec)).join('')}
    <div id="ipAllowlistSection"></div>
  `;
  wireSettings();
  await renderIpAllowlist();
}

function renderRefSection(sec){
  const entries = refCache[sec.collection] || [];
  const rows = entries.map(e=>{
    const cells = [];
    cells.push(`<td>
      ${e.color?`<span class="ref-swatch" style="background:${escapeHTML(e.color)}"></span>`:''}
      <strong>${escapeHTML(e.label)}</strong>
      ${e.isSystem?'<span class="ref-pill" style="margin-left:8px;">built in</span>':''}
      ${e.isActive?'':'<span class="ref-pill" style="margin-left:8px;">inactive</span>'}
      <div class="ref-key">${escapeHTML(e.key)}</div>
    </td>`);
    if(sec.collection==='asset-types') cells.push(`<td class="ref-key">${escapeHTML(e.codePrefix||'')}</td>`);
    if(sec.collection==='roles') cells.push(
      `<td>${escapeHTML(e.group||'')}</td>`,
      `<td><span class="ref-pill">${escapeHTML(e.tierLabel||e.tier||'')}</span></td>`
    );
    cells.push(`<td class="ref-actions">
      <button class="btn btn-ghost btn-sm ref-rename" data-c="${sec.collection}" data-k="${escapeHTML(e.key)}">Rename</button>
      ${e.isSystem?'':`<button class="btn btn-ghost btn-sm ref-toggle" data-c="${sec.collection}" data-k="${escapeHTML(e.key)}" data-active="${e.isActive?1:0}">${e.isActive?'Deactivate':'Reactivate'}</button>`}
      ${e.isSystem?'':`<button class="btn btn-ghost btn-sm ref-delete" data-c="${sec.collection}" data-k="${escapeHTML(e.key)}" style="color:var(--brand);">Delete</button>`}
    </td>`);
    return `<tr class="${e.isActive?'':'inactive'}">${cells.join('')}</tr>`;
  }).join('');

  const heads = ['Name'];
  if(sec.collection==='asset-types') heads.push('Prefix');
  if(sec.collection==='roles') heads.push('Group','Can do');
  heads.push('');

  return `
    <div class="ref-section" data-section="${sec.collection}">
      <div class="ref-head"><h3>${escapeHTML(sec.title)}</h3>
        <span class="ref-key">${entries.filter(e=>e.isActive).length} active${entries.length!==entries.filter(e=>e.isActive).length?` · ${entries.length-entries.filter(e=>e.isActive).length} inactive`:''}</span>
      </div>
      <div class="ref-note">${escapeHTML(sec.note)}</div>
      <table class="ref-table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
      <div class="ref-add">
        ${sec.columns.map(col=>`<div><label>${escapeHTML(col.label)}</label>${refInput(sec, col)}</div>`).join('')}
        <button class="btn btn-brand ref-create" data-c="${sec.collection}">Add</button>
      </div>
      <div class="ref-err" id="err-${sec.collection}"></div>
    </div>`;
}

function refInput(sec, col){
  const id = `new-${sec.collection}-${col.key}`;
  if(col.input==='color') return `<input type="color" id="${id}" value="#4db8ff" style="width:48px;padding:2px;height:34px;">`;
  if(col.input==='tier') return `<select id="${id}">${ROLE_TIERS.map(t=>`<option value="${t.key}" title="${escapeHTML(t.describe)}">${escapeHTML(t.label)}</option>`).join('')}</select>`;
  if(col.input==='group') return `<input type="text" id="${id}" list="ref-groups" placeholder="e.g. Engineering">
    <datalist id="ref-groups">${ROLE_GROUPS.map(g=>`<option value="${escapeHTML(g)}"></option>`).join('')}</datalist>`;
  return `<input type="text" id="${id}" class="${col.narrow?'narrow':''}" placeholder="${escapeHTML(col.placeholder||'')}">`;
}

function refError(collection, message){
  const el = document.getElementById('err-'+collection);
  if(el) el.textContent = message || '';
}

/* Anything that changes a list re-fetches it, so the dropdowns elsewhere in
   the app pick the change up without a reload. */
async function afterRefChange(message){
  await loadReferenceData();
  await loadRoles();
  await renderSettings();
  document.getElementById('filterType').innerHTML = '<option value="">All types</option>' + TYPES.map(t=>`<option value="${t.id}">${escapeHTML(t.label)}</option>`).join('');
  document.getElementById('f_priority').innerHTML = priorityOptions(PRIORITIES.some(p=>p.id==='med')?'med':(PRIORITIES[0]||{}).id);
  if(message) showToast(message);
}

function wireSettings(){
  document.querySelectorAll('.ref-create').forEach(btn=>btn.addEventListener('click', async ()=>{
    const collection = btn.dataset.c;
    const sec = REF_SECTIONS.find(x=>x.collection===collection);
    refError(collection, '');
    const body = {};
    for(const col of sec.columns){
      const input = document.getElementById(`new-${collection}-${col.key}`);
      if(input && input.value !== '') body[col.key] = input.value;
    }
    if(!body.label){ refError(collection, 'Give it a name first.'); return; }
    btn.disabled = true;
    try{
      await api('/reference/'+collection, { method:'POST', body });
      sec.columns.forEach(col=>{
        const input = document.getElementById(`new-${collection}-${col.key}`);
        if(input && col.input==='text') input.value='';
      });
      await afterRefChange(`"${body.label}" added.`);
    }catch(err){ refError(collection, err.message); }
    finally{ btn.disabled = false; }
  }));

  document.querySelectorAll('.ref-rename').forEach(btn=>btn.addEventListener('click', async ()=>{
    const { c: collection, k: key } = btn.dataset;
    const current = (refCache[collection]||[]).find(e=>e.key===key);
    const label = prompt(`Rename "${current.label}" to:`, current.label);
    if(label===null || label.trim()===current.label) return;
    try{
      await api(`/reference/${collection}/${encodeURIComponent(key)}`, { method:'PATCH', body:{ label } });
      await afterRefChange('Renamed. Records already using it are unaffected.');
    }catch(err){ refError(collection, err.message); }
  }));

  document.querySelectorAll('.ref-toggle').forEach(btn=>btn.addEventListener('click', async ()=>{
    const { c: collection, k: key } = btn.dataset;
    const makeActive = btn.dataset.active !== '1';
    try{
      await api(`/reference/${collection}/${encodeURIComponent(key)}`, { method:'PATCH', body:{ isActive: makeActive } });
      await afterRefChange(makeActive ? 'Reactivated.' : 'Deactivated — it is no longer offered in the dropdowns.');
    }catch(err){ refError(collection, err.message); }
  }));

  document.querySelectorAll('.ref-delete').forEach(btn=>btn.addEventListener('click', async ()=>{
    const { c: collection, k: key } = btn.dataset;
    const current = (refCache[collection]||[]).find(e=>e.key===key);
    refError(collection, '');
    /* Ask how many records use it before offering to delete, so the choice is
       informed rather than a refusal after the fact. */
    let usage;
    try{ usage = await api(`/reference/${collection}/${encodeURIComponent(key)}/usage`); }
    catch(err){ refError(collection, err.message); return; }

    if(usage.inUse > 0){
      const deactivate = confirm(
        `"${current.label}" is used by ${usage.inUse} record${usage.inUse===1?'':'s'}, so it can't be deleted.\n\n` +
        `Deactivate it instead? It will disappear from the dropdowns and those ${usage.inUse} record${usage.inUse===1?'':'s'} will keep working.`
      );
      if(!deactivate) return;
      try{
        await api(`/reference/${collection}/${encodeURIComponent(key)}`, { method:'PATCH', body:{ isActive:false } });
        await afterRefChange('Deactivated.');
      }catch(err){ refError(collection, err.message); }
      return;
    }

    if(!confirm(`Delete "${current.label}"? Nothing uses it, so this is safe.`)) return;
    try{
      await api(`/reference/${collection}/${encodeURIComponent(key)}`, { method:'DELETE' });
      await afterRefChange(`"${current.label}" deleted.`);
    }catch(err){ refError(collection, err.message); }
  }));
}

/* ---------- settings: who may reach this application at all ---------- */
/* The allowlist is checked before anything else on every request, so this is
   the one screen where a wrong entry costs someone their access. Everything
   here leans on that: it shows the address the server actually sees for you,
   marks the entry that is letting you in, and refuses to remove it quietly. */

let ipCache = { entries: [], enforcement: {}, yourAddress: null };

async function renderIpAllowlist(){
  const el = document.getElementById('ipAllowlistSection');
  if(!el) return;
  let data;
  try{ data = await api('/ip-allowlist'); }
  catch(err){
    el.innerHTML = `<div class="ref-section"><div class="ref-head"><h3>Allowed IP Addresses</h3></div>
      <div class="ref-err">${escapeHTML(err.message)}</div></div>`;
    return;
  }
  ipCache = data;
  const { entries, enforcement, yourAddress, yourAccess } = data;
  const active = entries.filter(e=>e.isActive);

  /* The storage behind this feature is unreadable. Say so at full volume and
     offer the repair, rather than showing an empty list that reads like "no
     restrictions configured" — the two look identical and mean opposite
     things. */
  if(data.storage && data.storage.ok === false){
    el.innerHTML = `
      <div class="ref-section" data-section="ip-allowlist">
        <div class="ref-head"><h3>Allowed IP Addresses</h3></div>
        <div class="ip-banner fault">
          <h4>This feature is not working, and access is not being restricted</h4>
          <p>${escapeHTML(data.storage.summary||'')}</p>
          <p>${escapeHTML(data.storage.cause||'')}</p>
          <p><code>${escapeHTML((data.storage.code?data.storage.code+': ':'')+(data.storage.detail||''))}</code></p>
          <p>${escapeHTML(data.storage.fix||'')}</p>
        </div>
        <div class="ip-you">You are connecting from <b>${escapeHTML(yourAddress||'an address the server could not read')}</b></div>
        ${data.storage.repairable?'<button class="btn btn-brand" id="ipRepairBtn">Repair now</button>':''}
        <div class="ref-err" id="err-ip-allowlist"></div>
      </div>`;
    const repair = document.getElementById('ipRepairBtn');
    if(repair) repair.addEventListener('click', async ()=>{
      repair.disabled = true; repair.textContent = 'Repairing…';
      ipError('');
      try{
        await api('/ip-allowlist/repair', { method:'POST' });
        showToast('Repaired — the allowlist is working again.');
        await renderIpAllowlist();
      }catch(err){
        ipError(err.message);
        repair.disabled = false; repair.textContent = 'Repair now';
      }
    });
    return;
  }

  /* Say plainly whether the gate is actually shut. Someone who has added
     addresses and believes the app is locked down, when it is not, is worse off
     than someone who knows it is open. */
  let banner;
  if(!enforcement.enabled){
    banner = `<div class="ip-banner open">The IP restriction is switched off for this server
      (<strong>IP_ALLOWLIST_ENABLED=false</strong>). Any address can reach the app, whatever is listed below.</div>`;
  }else if(enforcement.mode==='monitor'){
    banner = `<div class="ip-banner monitor">Monitor mode: nothing is being blocked. Addresses that
      <em>would</em> have been refused are written to the server log instead. Use this to confirm the
      addresses below are right, then set <strong>IP_ALLOWLIST_MODE=enforce</strong>.</div>`;
  }else if(!active.length){
    banner = `<div class="ip-banner open">The list is empty, so every address can reach this app.
      An empty list is treated as "not set up" on purpose — it means a mistake here can never lock
      everyone out. Add an address below to start restricting access.</div>`;
  }else{
    banner = `<div class="ip-banner live">Access is restricted to the
      ${active.length} address${active.length===1?'':'es'} below. Everyone else gets an Access Denied page.</div>`;
  }

  const rows = entries.map(e=>`
    <tr class="${e.isActive?'':'inactive'}">
      <td>
        <strong class="ref-key" style="font-size:12.5px;color:var(--ink);">${escapeHTML(e.address)}</strong>
        ${e.coversYou?'<span class="ip-mine">your address</span>':''}
        ${e.isActive?'':'<span class="ref-pill" style="margin-left:8px;">inactive</span>'}
      </td>
      <td>${escapeHTML(e.label||'')}</td>
      <td class="ref-key">${escapeHTML(e.createdBy||'system')}</td>
      <td class="ref-actions">
        <button class="btn btn-ghost btn-sm ip-edit" data-id="${escapeHTML(e.id)}">Edit</button>
        <button class="btn btn-ghost btn-sm ip-toggle" data-id="${escapeHTML(e.id)}" data-active="${e.isActive?1:0}">${e.isActive?'Deactivate':'Reactivate'}</button>
        <button class="btn btn-ghost btn-sm ip-delete" data-id="${escapeHTML(e.id)}" style="color:var(--brand);">Remove</button>
      </td>
    </tr>`).join('');

  /* How you got in matters when you are about to edit the list. If an emergency
     address or the bypass token is what let you through, removing your entry
     will not lock you out — and if nothing but the list did, it will. */
  const accessNote = {
    'emergency': 'You are here via an emergency address set in the server environment, not via this list.',
    'bypass-token': 'You are here via the bypass token, not via this list.',
    'disabled': 'The gate is switched off, so nothing here is being checked right now.',
    'unconfigured': 'Nothing is being enforced yet.',
  }[yourAccess] || '';

  el.innerHTML = `
    <div class="ref-section" data-section="ip-allowlist">
      <div class="ref-head"><h3>Allowed IP Addresses</h3>
        <span class="ref-key">${active.length} active${entries.length!==active.length?` · ${entries.length-active.length} inactive`:''}</span>
      </div>
      <div class="ref-note">Which addresses may reach this application at all. Checked before sign-in, on every request.</div>
      ${banner}
      <div class="ip-you">You are connecting from <b>${escapeHTML(yourAddress||'an address the server could not read')}</b>${accessNote?` — ${escapeHTML(accessNote)}`:''}</div>
      <table class="ref-table">
        <thead><tr><th>Address or range</th><th>Note</th><th>Added by</th><th></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="4" class="ref-key">Nothing listed — the app is open to every address.</td></tr>'}</tbody>
      </table>
      <div class="ref-add">
        <div><label>Address or range</label><input type="text" id="new-ip-address" placeholder="106.51.81.61 or 106.51.81.0/24" style="width:230px;"></div>
        <div><label>Note</label><input type="text" id="new-ip-label" placeholder="e.g. Bangalore studio" style="width:200px;"></div>
        <button class="btn btn-brand" id="ipCreateBtn">Add</button>
      </div>
      <div class="ref-err" id="err-ip-allowlist"></div>
      <details class="ip-audit"><summary>Change history</summary><div id="ipAuditBody" class="ref-key">Loading…</div></details>
    </div>`;
  wireIpAllowlist();
}

function ipError(message){
  const el = document.getElementById('err-ip-allowlist');
  if(el) el.textContent = message || '';
}

function wireIpAllowlist(){
  document.getElementById('ipCreateBtn').addEventListener('click', async (ev)=>{
    const address = document.getElementById('new-ip-address').value.trim();
    const label = document.getElementById('new-ip-label').value.trim();
    ipError('');
    if(!address){ ipError('Enter an IP address or CIDR range.'); return; }
    ev.target.disabled = true;
    try{
      await api('/ip-allowlist', { method:'POST', body:{ address, label } });
      document.getElementById('new-ip-address').value = '';
      document.getElementById('new-ip-label').value = '';
      await renderIpAllowlist();
      /* Worth stating outright: this is live immediately, no restart involved. */
      showToast(`${address} added — it can reach the app straight away.`);
    }catch(err){ ipError(err.message); }
    finally{ ev.target.disabled = false; }
  });

  document.querySelectorAll('.ip-edit').forEach(btn=>btn.addEventListener('click', async ()=>{
    const entry = (ipCache.entries||[]).find(e=>e.id===btn.dataset.id);
    if(!entry) return;
    const address = prompt('Address or CIDR range:', entry.address);
    if(address===null) return;
    const label = prompt('Note (optional):', entry.label||'');
    if(label===null) return;
    ipError('');
    try{
      await api('/ip-allowlist/'+encodeURIComponent(entry.id), { method:'PATCH', body:{ address, label } });
      await renderIpAllowlist();
      showToast('Updated.');
    }catch(err){ ipError(err.message); }
  }));

  document.querySelectorAll('.ip-toggle').forEach(btn=>btn.addEventListener('click', async ()=>{
    const entry = (ipCache.entries||[]).find(e=>e.id===btn.dataset.id);
    if(!entry) return;
    const makeActive = btn.dataset.active !== '1';
    /* Deactivating is a removal in everything but name, so it gets the same
       warning when it is the entry letting you in. */
    if(!makeActive && entry.coversYou && ipCache.enforcement.effective){
      if(!confirm(`${entry.address} is the entry letting you in from ${ipCache.yourAddress}.\n\nDeactivating it will lock you out of this application. Continue?`)) return;
    }
    ipError('');
    try{
      await api('/ip-allowlist/'+encodeURIComponent(entry.id), { method:'PATCH', body:{ isActive: makeActive } });
      await renderIpAllowlist();
      showToast(makeActive ? 'Reactivated.' : 'Deactivated — that address can no longer reach the app.');
    }catch(err){ ipError(err.message); }
  }));

  document.querySelectorAll('.ip-delete').forEach(btn=>btn.addEventListener('click', async ()=>{
    const entry = (ipCache.entries||[]).find(e=>e.id===btn.dataset.id);
    if(!entry) return;
    ipError('');
    /* Ask first, then let the server ask again: it refuses a removal that would
       cut off the caller unless the request says so explicitly, so a script or
       a stale page gets the same protection this dialog gives. */
    if(entry.coversYou && ipCache.enforcement.effective){
      const others = (ipCache.entries||[]).filter(e=>e.id!==entry.id && e.isActive && e.coversYou);
      const message = others.length
        ? `${entry.address} covers your own address (${ipCache.yourAddress}), but another entry still does too, so you will keep your access.\n\nRemove it?`
        : `${entry.address} is what is letting you in from ${ipCache.yourAddress}.\n\nRemoving it will lock you out of this application immediately. You would need someone with access to the server's environment settings to get back in.\n\nRemove it anyway?`;
      if(!confirm(message)) return;
    }else if(!confirm(`Remove ${entry.address} from the allowlist?`)){
      return;
    }
    try{
      const result = await api('/ip-allowlist/'+encodeURIComponent(entry.id)+'?confirm=yes', { method:'DELETE' });
      await renderIpAllowlist();
      showToast(result.warning || `${entry.address} removed.`);
    }catch(err){ ipError(err.message); }
  }));

  const audit = document.querySelector('.ip-audit');
  /* Fetched when opened rather than with the page — it is the part nobody reads
     until something has gone wrong. */
  audit.addEventListener('toggle', async ()=>{
    if(!audit.open || audit.dataset.loaded) return;
    audit.dataset.loaded = '1';
    const body = document.getElementById('ipAuditBody');
    try{
      const { entries, unavailable } = await api('/ip-allowlist/audit');
      if(unavailable){ body.textContent = 'The change history cannot be read while the storage is unavailable.'; return; }
      body.innerHTML = entries.length ? `<table class="ref-table">
        <thead><tr><th>When</th><th>Change</th><th>Address</th><th>By</th><th>From</th></tr></thead>
        <tbody>${entries.map(e=>`<tr>
          <td class="ref-key">${escapeHTML(new Date(e.at).toLocaleString())}</td>
          <td><span class="ip-act ${e.action==='removed'?'removed':''}">${escapeHTML(e.action)}</span></td>
          <td class="ref-key">${escapeHTML(e.address||'')}${e.detail?`<div class="ref-key" style="opacity:.7;">${escapeHTML(e.detail)}</div>`:''}</td>
          <td>${escapeHTML(e.actor||'system')}</td>
          <td class="ref-key">${escapeHTML(e.actorIp||'')}</td>
        </tr>`).join('')}</tbody></table>` : 'No changes recorded yet.';
    }catch(err){ body.textContent = err.message; }
  });
}

/* ---------- profile / change password ---------- */
const profileModalWrap = document.getElementById('profileModalWrap');
let passwordPolicy = null;   // fetched once, from the same rules the API enforces

const PF_FIELDS = ['pf_current', 'pf_new', 'pf_confirm'];
function pfError(id, message){ document.getElementById(id + '_err').textContent = message || ''; }
function clearPfErrors(){ PF_FIELDS.forEach(f => pfError(f, '')); }

/* Render the rule checklist, ticking off whatever the typed password satisfies.
   The rules come from the server so this can never disagree with it. */
function renderPasswordRules(value){
  const list = document.getElementById('pf_rules');
  if(!passwordPolicy){ list.innerHTML = ''; return; }
  list.innerHTML = passwordPolicy.rules.map(r => {
    const met = checkRule(r.id, value || '');
    return `<li class="${met?'met':''}"><span class="tick">${met?'✓':'○'}</span>${escapeHTML(r.label)}</li>`;
  }).join('');
}
/* Mirrors src/password-policy.js. The server is still the authority — this only
   decides which line in the checklist is ticked while someone is typing. */
function checkRule(id, pw){
  switch(id){
    case 'length':    return pw.length >= passwordPolicy.minLength;
    case 'uppercase': return /[A-Z]/.test(pw);
    case 'lowercase': return /[a-z]/.test(pw);
    case 'number':    return /[0-9]/.test(pw);
    case 'symbol':    return /[^A-Za-z0-9]/.test(pw);
    default:          return false;
  }
}
function passwordMeetsPolicy(pw){
  return Boolean(passwordPolicy) && passwordPolicy.rules.every(r => checkRule(r.id, pw));
}

async function openProfileModal(){
  const u = state.currentUser;
  document.getElementById('pf_identity').innerHTML =
    `<strong>${escapeHTML(u.name)}</strong><br><span class="mono" style="font-size:11.5px;color:var(--ink-muted);">${escapeHTML(u.email)}</span>`;
  PF_FIELDS.forEach(f => { document.getElementById(f).value = ''; });
  clearPfErrors();
  document.querySelectorAll('.pw-toggle').forEach(b => {
    b.textContent = 'Show';
    document.getElementById(b.dataset.target).type = 'password';
  });
  if(!passwordPolicy){
    try{ passwordPolicy = await api('/auth/password-policy'); }
    catch(err){ /* the checklist is a convenience; the server still validates */ }
  }
  renderPasswordRules('');
  profileModalWrap.classList.add('show');
}

document.getElementById('profileBtn').addEventListener('click', openProfileModal);
document.getElementById('cancelProfileModal').addEventListener('click', ()=>profileModalWrap.classList.remove('show'));
profileModalWrap.addEventListener('click', e=>{ if(e.target===profileModalWrap) profileModalWrap.classList.remove('show'); });

document.querySelectorAll('.pw-toggle').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const input = document.getElementById(btn.dataset.target);
    const hidden = input.type === 'password';
    input.type = hidden ? 'text' : 'password';
    btn.textContent = hidden ? 'Hide' : 'Show';
    input.focus();
  });
});

document.getElementById('pf_new').addEventListener('input', e=>{
  renderPasswordRules(e.target.value);
  pfError('pf_new', '');
  const confirmVal = document.getElementById('pf_confirm').value;
  if(confirmVal) pfError('pf_confirm', confirmVal === e.target.value ? '' : 'The new passwords do not match.');
});
document.getElementById('pf_confirm').addEventListener('input', e=>{
  const newVal = document.getElementById('pf_new').value;
  pfError('pf_confirm', !e.target.value || e.target.value === newVal ? '' : 'The new passwords do not match.');
});
document.getElementById('pf_current').addEventListener('input', ()=>pfError('pf_current', ''));

async function submitPasswordChange(){
  const currentPassword = document.getElementById('pf_current').value;
  const newPassword     = document.getElementById('pf_new').value;
  const confirmPassword = document.getElementById('pf_confirm').value;
  clearPfErrors();

  /* Catch what we can before spending a round trip; the server re-checks all of it. */
  let bad = false;
  if(!currentPassword){ pfError('pf_current', 'Enter your current password.'); bad = true; }
  if(!newPassword){ pfError('pf_new', 'Enter a new password.'); bad = true; }
  else if(!passwordMeetsPolicy(newPassword)){ pfError('pf_new', 'This password does not meet the requirements below.'); bad = true; }
  else if(newPassword === currentPassword){ pfError('pf_new', 'Your new password must be different from your current one.'); bad = true; }
  if(newPassword && confirmPassword !== newPassword){ pfError('pf_confirm', 'The new passwords do not match.'); bad = true; }
  if(bad) return;

  const btn = document.getElementById('savePasswordBtn');
  btn.disabled = true; btn.textContent = 'Changing…';
  try{
    const res = await api('/auth/password', { method:'POST', body:{ currentPassword, newPassword, confirmPassword } });
    /* The old token was invalidated by the change; keep this session on the new one. */
    if(res.token){ state.token = res.token; localStorage.setItem('zvky_token', res.token); }
    profileModalWrap.classList.remove('show');
    PF_FIELDS.forEach(f => { document.getElementById(f).value = ''; });
    showToast(res.message || 'Password changed.');
  }catch(err){
    /* The API names the field at fault, so the message lands next to it. */
    const field = err.field ? 'pf_' + ({ currentPassword:'current', newPassword:'new', confirmPassword:'confirm' })[err.field] : null;
    if(field) pfError(field, err.message);
    else showToast(err.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Change password';
  }
}
document.getElementById('savePasswordBtn').addEventListener('click', submitPasswordChange);
document.getElementById('pf_confirm').addEventListener('keydown', e=>{ if(e.key==='Enter') submitPasswordChange(); });

boot();
</script>
