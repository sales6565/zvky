<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
     but zero on a notched iPhone. Without it this screen sits under the clock. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zvky Forge — offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    padding: calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #12121a; color: #e7e7ee; text-align: center;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .mark { width: 56px; height: 56px; border-radius: 14px; background: #7f1416;
    display: grid; place-items: center; font-weight: 700; font-size: 26px; margin-bottom: 22px; }
  h1 { font-size: 19px; margin: 0 0 10px; font-weight: 600; }
  p { margin: 0 0 8px; color: #9a9aa8; max-width: 30rem; }
  .hint { font-size: 13px; color: #6e6e7c; margin-top: 18px; }
  button { margin-top: 24px; padding: 13px 26px; font-size: 15px; font-weight: 600;
    border: 0; border-radius: 9px; background: #7f1416; color: #fff; min-width: 190px; }
  button[disabled] { opacity: .55; }
  .state { margin-top: 14px; font-size: 13px; min-height: 1.2em; color: #6e6e7c; }
</style>
</head>
<body>
  <div class="mark">Z</div>
  <h1>No connection</h1>
  <p>Zvky Forge works against the studio's server, so it needs a network to show you anything.</p>
  <p class="hint">On the office Wi-Fi and still seeing this? The server may be restarting — try again in a moment.</p>
  <button id="retry">Try again</button>
  <div class="state" id="state"></div>

<script>
/* THE OFFLINE SCREEN, and the two things it has to get right.
 *
 * 1. It must not be a dead end. Capacitor loads this file when the remote URL
 *    fails; nothing navigates back on its own, so this page owns the retry.
 * 2. It must not retry into a black hole. Reloading while still offline shows
 *    this page again and feels broken, so the button checks connectivity first
 *    and the Network plugin retries automatically the moment the phone is back.
 */
(function () {
  var APP_URL = 'https://zvkydesign.com';
  var retry = document.getElementById('retry');
  var state = document.getElementById('state');
  var Cap = window.Capacitor;
  var Network = Cap && Cap.Plugins && Cap.Plugins.Network;

  function go() { window.location.replace(APP_URL); }

  function attempt() {
    retry.disabled = true;
    state.textContent = 'Checking…';
    /* A HEAD against the server itself, not navigator.onLine: a phone attached
       to a captive portal reports itself online and would bounce straight back
       here. cache:'no-store' so a previous failure is not answered from cache. */
    fetch(APP_URL + '/api/health', { method: 'HEAD', cache: 'no-store' })
      .then(function () { go(); })
      .catch(function () {
        state.textContent = 'Still no connection.';
        retry.disabled = false;
      });
  }

  retry.addEventListener('click', attempt);

  /* Back on the network: go, without anybody having to notice. */
  if (Network && Network.addListener) {
    Network.addListener('networkStatusChange', function (status) {
      if (status && status.connected) attempt();
    });
    Network.getStatus().then(function (status) {
      if (status && status.connected) attempt();
    }).catch(function () { /* the plugin is optional */ });
  } else {
    window.addEventListener('online', attempt);
  }
})();
</script>
</body>
</html>
